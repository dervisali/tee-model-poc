version: "3.9"

# TEE-Model — yerel Ollama tabanlı RAG yığını
#
# `docker compose up` komutu ile birlikte:
#  - ollama : gemma3:4b modelini sunan yerel LLM servisi
#  - app    : Streamlit kullanıcı arayüzü (8501 portunda)
#
# Modelin ilk indirilmesi tek seferlik bir maliyettir; ollama_data volume'unda
# kalıcılaştırılır.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: tee_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "ollama pull gemma3:4b"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  app:
    build: .
    container_name: tee_app
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - GENERATION_MODEL=gemma3:4b
      - EMBEDDING_MODEL=intfloat/multilingual-e5-large
      - MOCK_MODE=false
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ./evaluation:/app/evaluation
    restart: unless-stopped

volumes:
  ollama_data:
