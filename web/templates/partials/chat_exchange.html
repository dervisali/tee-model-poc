{# One user→assistant exchange, appended to #chat-log #}
<div class="rise space-y-4">

  <!-- User -->
  <div class="flex justify-end">
    <div class="max-w-[80%] rounded-2xl rounded-br-md bg-brand-600 px-4 py-2.5 text-sm text-white shadow-sm whitespace-pre-wrap">{{ message }}</div>
  </div>

  <!-- Assistant -->
  <div class="flex gap-3">
    <div class="mt-0.5 h-8 w-8 shrink-0 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-base">🏛️</div>
    <div class="min-w-0 flex-1">
      <div class="answer rounded-2xl rounded-tl-md bg-white px-4 py-3 text-sm leading-relaxed text-slate-800 shadow-card ring-1 ring-slate-100">{{ answer }}</div>

      {% include "partials/_sources.html" %}

      {% if refused %}
      <div class="mt-2 inline-flex items-center gap-1.5 rounded-lg bg-amber-50 px-2.5 py-1 text-[11px] font-medium text-amber-700 ring-1 ring-amber-200">
        ⚠️ Grounding kapısı: doğrulanabilir kaynak bulunamadığı için yanıt verilmedi
      </div>
      {% endif %}
    </div>
  </div>
</div>
<script>document.querySelector('main').scrollTop = document.querySelector('main').scrollHeight;</script>
