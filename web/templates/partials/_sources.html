{% if sources %}
<div class="mt-3">
  <div class="flex items-center gap-2 mb-2 text-xs font-semibold text-slate-500">
    <span>📎 Kaynaklar</span>
    <span class="rounded-full bg-slate-100 px-1.5 py-0.5 text-[10px] text-slate-500">{{ sources|length }}</span>
  </div>
  <div class="grid gap-2 sm:grid-cols-2">
    {% for s in sources %}
    <div class="group rounded-xl border border-slate-200 bg-white p-3 hover:shadow-lift hover:border-brand-200 transition">
      <div class="flex items-center justify-between gap-2">
        <span class="truncate text-[13px] font-semibold text-slate-800" title="{{ s.filename }}">{{ s.filename }}</span>
        {% if s.score is not none %}
        <span class="shrink-0 rounded-full bg-brand-50 px-2 py-0.5 text-[10px] font-semibold text-brand-700 ring-1 ring-brand-100">{{ '%.2f'|format(s.score) }}</span>
        {% endif %}
      </div>
      {% if s.score is not none %}
      <div class="mt-1.5 h-1 w-full rounded-full bg-slate-100 overflow-hidden">
        <div class="h-full rounded-full bg-brand-500" style="width: {{ (s.score * 100)|round|int }}%"></div>
      </div>
      {% endif %}
      {% if s.snippet %}
      <p class="mt-2 text-[12px] leading-snug text-slate-500 line-clamp-3">{{ s.snippet }}</p>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
